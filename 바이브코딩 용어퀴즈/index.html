<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>바이브코딩 용어 퀴즈</title>
<style>
:root{--bg:#0b0e22;--panel:#141836;--card:#1b2048;--line:#2b3168;--ink:#eef0ff;--sub:#9ba1d4;--accent:#7c6cff;--accent2:#b3a8ff;--gold:#f6b93f;--ok:#3ddc97;--bad:#ff6b81;--stage:#0f1230}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1d2260 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.top{margin:6px 0 18px}
.eyebrow{font-size:11px;letter-spacing:.32em;color:var(--sub);font-family:ui-monospace,Consolas,monospace}
h1{margin:6px 0 0;font-size:clamp(24px,5vw,34px);letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}
.panel h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600}
.panel h2 small{color:var(--accent2);font-weight:500;margin-left:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.mode input,.cat input{position:absolute;opacity:0;pointer-events:none}
.mode span{display:block;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.15s}
.mode b{display:block;font-size:17px}
.mode small{color:var(--sub);font-size:13px}
.mode input:checked+span{border-color:var(--accent);box-shadow:0 0 0 4px #7c6cff2a}
.mode input:focus-visible+span,.cat input:focus-visible+span{outline:2px solid var(--gold)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.cat span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;transition:.15s}
.cat span::before{content:'';width:14px;height:14px;border-radius:4px;border:2px solid var(--sub)}
.cat input:checked+span{border-color:var(--accent)}
.cat input:checked+span::before{background:var(--accent);border-color:var(--accent)}
.bests{font-size:13px;color:var(--sub);margin-bottom:16px}
.primary{background:var(--accent);border:0;border-radius:14px;padding:12px 20px;font-weight:700;color:#fff;box-shadow:0 8px 24px #7c6cff40}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.primary.big{width:100%;padding:15px;font-size:17px}
#btnStart{background:#c4bbff;color:#221a66;box-shadow:0 8px 22px #b3a8ff44}
#btnAll{background:#4f39e8;color:#fff;box-shadow:0 0 0 2px #8f7dff inset,0 10px 28px #5b45f088}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.ghost:hover{border-color:var(--accent)}
.ghost:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;padding:6px}
.credit{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.6}
.credit a{color:var(--accent2)}
.qtop{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--sub);margin-bottom:12px}
.qtop .bar{flex:1;height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.qtop .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stage{position:relative;height:clamp(240px,46vw,320px);background:var(--stage);border:1px solid var(--line);border-radius:20px;overflow:hidden;touch-action:pan-y}
.stage .try{position:absolute;right:10px;top:10px;z-index:5;font-size:12px;color:var(--sub);background:#0009;border-radius:999px;padding:4px 10px;pointer-events:none}
.tools{display:flex;align-items:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.hint{color:var(--gold);font-size:14px}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;outline:none}
.ansrow input:focus{border-color:var(--accent)}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.choice.right{border-color:var(--ok);background:#3ddc9718}
.choice.wrong{border-color:var(--bad);background:#ff6b8118}
.choice:disabled{cursor:default}
.feedback{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.feedback .verdict{font-size:19px;font-weight:800;margin-bottom:6px}
.feedback .verdict.ok{color:var(--ok)}
.feedback .verdict.bad{color:var(--bad)}
.feedback .msg{color:var(--sub);font-size:14px;margin-bottom:10px}
.feedback .name{font-size:22px;font-weight:800;color:var(--gold)}
.feedback .name small{font-size:15px;color:var(--ink);font-weight:500;margin-left:6px}
.feedback .nick{font-size:14px;color:var(--accent2);margin:4px 0}
.feedback .desc{font-size:15px;line-height:1.55;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.score-big{font-size:46px;font-weight:900;margin:4px 0}
.score-big small{font-size:20px;color:var(--sub)}
.wrongs{display:grid;gap:6px;margin:14px 0}
.wrongs button{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.wrongs button.on{border-color:var(--accent)}
.wrongs b{color:var(--gold);font-size:16px}
.wrongs small{color:var(--sub)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowbtns .primary{flex:1}

/* ---------- 전체 보기 (치트시트) ---------- */
.app.wide{max-width:1320px}
#btnSheet{width:100%;margin-top:10px;padding:14px;font-size:16px;font-weight:800;color:#2a1a00;background:linear-gradient(135deg,#ffd36b,#f6a93f);border:0;border-radius:14px;box-shadow:0 8px 24px #f6b93f55}
#btnSheet:hover{filter:brightness(1.06);border:0}
.sv-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sv-head h2{margin:4px 0 0;font-size:clamp(20px,3vw,26px)}
.sv-cats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:start}
.sv-cat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.sv-cat h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;font-size:17px}
.sv-cat h3 span{color:var(--sub);font-size:13px;font-weight:500;margin-left:6px}
.sv-cat h3 small{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.25em;color:var(--sub)}
.sv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sv-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px}
.mini{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--stage)}
.mini .stage{position:absolute;left:0;top:0;width:480px;height:300px;transform-origin:0 0;border:0;border-radius:0}
.sv-card b{display:block;color:var(--gold);font-size:15px;margin-top:8px;line-height:1.25}
.sv-card .meta{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--sub);margin-top:2px}
.sv-card .meta i{font-style:normal;font-family:ui-monospace,Consolas,monospace;opacity:.7}

/* ---------- demo pieces ---------- */
.d-root{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.d-root>*{grid-area:1/1}
.d-root.nocur,.d-root.nocur *{cursor:none}
.mcard{width:180px;height:96px;background:#f3f4ff;border-radius:14px;padding:16px;box-shadow:0 12px 30px #0007;display:flex;flex-direction:column;gap:9px}
.mcard i{display:block;height:8px;width:80%;border-radius:4px;background:#2a2f5a}
.mcard i.s{width:55%;background:#b9bce0}
.mcard b{margin-top:auto;align-self:flex-end;width:46px;height:16px;border-radius:8px;background:var(--accent)}
.pill{display:inline-block;padding:12px 26px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 8px 24px #7c6cff55;white-space:nowrap;user-select:none}
.ibox{position:relative;width:76px;height:76px;border-radius:18px;background:#232a62;display:grid;place-items:center;box-shadow:0 10px 26px #0006}
.badge{position:absolute;right:-10px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.track{position:absolute;height:2px;background:#2d3470;transform:translateY(-50%)}
.gdot{position:absolute;left:0;width:24px;height:24px;border-radius:50%;box-shadow:0 0 18px currentColor}
.gdot.ghost{width:10px;height:10px;opacity:.28;box-shadow:none}
.ballbox{position:relative;width:200px;height:170px}
.ball{position:absolute;left:80px;bottom:4px;width:40px;height:40px;border-radius:50%;background:var(--accent);box-shadow:0 0 22px #7c6cff88;display:grid;place-items:center;color:#fff;font-weight:900}
.floor{position:absolute;left:0;right:0;bottom:2px;height:2px;background:#3a4190}
.dd{display:grid;gap:14px;width:min(78%,300px)}
.dd .row{height:14px;border-radius:7px;background:#1f2552;overflow:hidden}
.dd .row i{display:block;height:100%;border-radius:7px;transform-origin:left;transform:scaleX(0)}
.bigtxt{font-size:clamp(28px,7vw,42px);font-weight:800;letter-spacing:1px;white-space:pre}
.caret{display:inline-block;width:3px;height:1em;background:var(--accent2);margin-left:4px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.scr .sc{color:var(--accent2)}
.split span{display:inline-block;white-space:pre}
.cnt{text-align:center}
.cnt small{display:block;color:var(--sub);font-size:14px;margin-bottom:4px}
.cnt b{font-size:clamp(36px,9vw,56px);font-weight:900;font-variant-numeric:tabular-nums}
.burger{position:relative;width:70px;height:54px}
.burger i{position:absolute;left:0;width:70px;height:7px;border-radius:4px;background:#fff}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:23.5px}.burger i:nth-child(3){top:47px}
.mq{width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.mq .belt{display:flex;width:max-content}
.mq .belt span{font-size:22px;font-weight:800;color:#cfd3ff;padding:0 26px;white-space:nowrap}
.mbox{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:10px;background:var(--accent);box-shadow:0 0 20px #7c6cff99}
.cart{position:absolute;color:#fff}
.frame{position:relative;width:min(88%,400px);height:78%;border-radius:14px;background:#f3f4ff;overflow:hidden;box-shadow:0 14px 34px #0008;color:#222}
.fbar{height:24px;background:#dfe2fb;display:flex;align-items:center;gap:5px;padding:0 10px}
.fbar i{width:8px;height:8px;border-radius:50%;background:#b5b9e6}
.fbody{position:absolute;left:0;right:0;top:24px;bottom:0;overflow:hidden}
.pg{position:absolute;inset:0;padding:16px;display:flex;gap:12px}
.ln{height:9px;border-radius:5px;background:#3a3f6e;margin-bottom:9px}
.ln.s{background:#c2c5e8}
.wipe{position:absolute;inset:0;background:var(--accent);transform:scaleX(0)}
.slist{position:absolute;inset:0;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.slist .thumb{aspect-ratio:1;border-radius:10px;margin-bottom:8px}
.sclone{position:absolute;border-radius:10px}
.sdetail{position:absolute;right:14px;top:18px;width:42%;opacity:0}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tall{position:relative;height:400%}
.strip{position:absolute;left:18px;top:0;bottom:0;width:54px;background:repeating-linear-gradient(180deg,#2a3170 0 10px,transparent 10px 34px);opacity:.7;border-radius:6px}
.sticky{position:sticky;top:0;display:grid;place-items:center}
.pinbox{width:130px;height:86px;border-radius:14px;background:var(--accent);border:3px solid #fff;display:grid;place-items:center;font-size:40px;font-weight:900;color:#fff;box-shadow:0 0 30px #7c6cff66}
.ptrack{position:absolute;right:22%;top:50%;width:6px;height:110px;margin-top:-55px;border-radius:3px;background:#262c66}
.ptrack i{position:absolute;left:0;top:0;width:100%;border-radius:3px;background:#5fe3ff}
.hrow{position:absolute;left:96px;top:50%;display:flex;gap:14px;margin-top:-48px}
.hrow i{width:130px;height:96px;border-radius:12px;flex:none}
.mouse{position:absolute;left:22px;top:50%;margin-top:-34px;width:34px;height:52px;border:3px solid #d9dcff;border-radius:18px}
.mouse::after{content:'';position:absolute;left:50%;top:8px;width:4px;height:9px;margin-left:-2px;border-radius:2px;background:#d9dcff}
.chev{position:absolute;left:30px;top:50%;margin-top:24px;color:#9be8ff;font-size:18px}
.mring{border:2px dashed #4d55a8;border-radius:50%}
.fcur{position:absolute;left:0;top:0;z-index:4;pointer-events:none}
.ccard{width:150px;height:110px;border-radius:16px;background:linear-gradient(160deg,#5b7cff,#2a2f6e);display:grid;place-items:center}
.ccur{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:2px solid #fff;pointer-events:none;z-index:4;mix-blend-mode:difference;background:#ffffff10}
.cdot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff;pointer-events:none;z-index:4}
.tilt{perspective:800px}
.tcard{position:relative;width:160px;height:210px;border-radius:20px;background:linear-gradient(150deg,#8f7dff,#4b3bd1);box-shadow:0 20px 40px #0008;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;overflow:hidden;transform-style:preserve-3d}
.tcard .p{font-size:26px;font-weight:900;color:#fff}
.tcard .b{width:110px;height:24px;border-radius:8px;background:#fff}
.tcard .shine{position:absolute;inset:0;pointer-events:none}
.conf{position:absolute;left:50%;top:50%;width:8px;height:12px;border-radius:2px}
.paybtn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1a1d3a;font-weight:800;border-radius:999px;padding:10px 20px;box-shadow:0 10px 24px #0007;cursor:pointer;user-select:none;z-index:2}
.paybtn i{width:22px;height:22px;border-radius:50%;background:#2fbf71;color:#fff;font-style:normal;display:grid;place-items:center;font-size:13px}
/* ---------- UI demo pieces ---------- */
.frame .sc2{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.frame .sc2::-webkit-scrollbar{display:none}
.hnav{height:26px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff}
.hnav .logo{width:10px;height:10px;border-radius:50%;background:#7c6cff}
.hnav span{width:24px;height:5px;border-radius:3px;background:#b9bce0}
.hnav b{margin-left:auto;width:36px;height:12px;border-radius:6px;background:#7c6cff}
.hero{display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(135deg,#ece9ff,#f8f8ff)}
.hero .hl{flex:1.2}
.t1{height:14px;width:90%;border-radius:7px;background:#1d2246;margin-bottom:8px}
.t2{height:14px;width:65%;border-radius:7px;background:#7c6cff;margin-bottom:12px}
.cta{display:flex;gap:8px;margin-top:12px}
.cta b{width:60px;height:20px;border-radius:10px;background:#7c6cff}
.cta i{width:60px;height:20px;border-radius:10px;border:2px solid #7c6cff}
.hero .hv{flex:1;height:62%;border-radius:12px;background:linear-gradient(135deg,#b4a9ff,#6b5cf0)}
.below{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.below div{height:64px;border-radius:8px;background:#dfe2fb}
.rgrid{position:absolute;inset:0;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;align-content:start}
.rgrid div{height:46px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;gap:4px}
.rgrid div i{display:block;height:5px;border-radius:3px;background:#ffffffcc}
.ucards{display:flex;gap:12px}
.ucard{width:96px;height:126px;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px}
.ucard>*{border-radius:5px}
.ucard .th{height:52px;border-radius:8px}
.ucard .a{height:7px;background:#3a3f6e}
.ucard .b{height:7px;width:65%;background:#c2c5e8}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:8px;width:min(86%,330px);height:76%}
.bento i{border-radius:12px}
.side{position:absolute;left:0;top:0;bottom:0;width:30%;background:#1d2246;padding:12px 10px}
.side .lg{width:12px;height:12px;border-radius:4px;background:#7c6cff;margin-bottom:14px}
.side .mi{position:relative;height:22px;display:flex;align-items:center;padding-left:8px}
.side .mi i{width:60%;height:5px;border-radius:3px;background:#6d73b0}
.side .act{position:absolute;left:6px;right:6px;height:22px;border-radius:7px;background:#7c6cff55;transition:top .45s cubic-bezier(.5,0,.3,1)}
.mainc{position:absolute;left:30%;right:0;top:0;bottom:0;overflow:hidden;padding:12px}
.chart{display:flex;align-items:flex-end;gap:8px;height:90px;margin-bottom:12px}
.chart i{flex:1;border-radius:4px 4px 0 0;background:#7c6cff}
.blk{height:44px;border-radius:8px;background:#dfe2fb;margin-bottom:10px}
.shead{position:sticky;top:0;z-index:2;height:30px;background:#7c6cff;display:flex;align-items:center;gap:8px;padding:0 12px;transition:box-shadow .2s}
.shead i{width:10px;height:10px;border-radius:50%;background:#fff}
.shead span{width:26px;height:5px;border-radius:3px;background:#ffffffaa}
.shead span:first-of-type{margin-left:auto}
.shead.sh{box-shadow:0 6px 14px #0004}
.uitab{width:min(86%,320px);background:#f3f4ff;border-radius:14px;overflow:hidden;color:#222;box-shadow:0 12px 30px #0007}
.uitab .bar{position:relative;display:flex;border-bottom:1px solid #d9dcf5}
.uitab .bar button{flex:1;background:none;border:0;padding:11px 0;font-size:14px;font-weight:700;color:#8a8fb8}
.uitab .bar button.on{color:#3b32b5}
.uitab .ind{position:absolute;bottom:-1px;height:3px;background:#7c6cff;border-radius:2px;transition:left .35s cubic-bezier(.5,0,.3,1),width .35s}
.uitab .panes{position:relative;height:110px}
.uitab .pane{position:absolute;inset:0;padding:14px;opacity:0;transition:opacity .3s}
.uitab .pane.on{opacity:1}
.acc{width:min(84%,300px);display:grid;gap:8px}
.acc .it{background:#f3f4ff;border-radius:12px;overflow:hidden;color:#222}
.acc .hd{display:flex;align-items:center;padding:11px 14px;cursor:pointer}
.acc .hd i{flex:1;height:6px;max-width:60%;border-radius:3px;background:#3a3f6e}
.acc .hd b{margin-left:auto;font-size:12px;color:#6b5cf0;transition:transform .35s}
.acc .it.open .hd b{transform:rotate(180deg)}
.acc .bd{height:0;overflow:hidden;transition:height .4s cubic-bezier(.5,0,.3,1);padding:0 14px}
.acc .bd>div{padding-top:4px}
.acc .it.open .bd{height:58px}
.dim{position:absolute;inset:0;background:#0a0c1e;opacity:0}
.dialog{position:absolute;left:50%;top:50%;width:62%;padding:16px;border-radius:14px;background:#fff;box-shadow:0 20px 40px #0006;opacity:0;transform:translate(-50%,-50%) scale(.85)}
.dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dialog .btns i{width:52px;height:22px;border-radius:7px;background:#dfe2fb}
.dialog .btns b{width:52px;height:22px;border-radius:7px;background:#7c6cff}
.drawer{position:absolute;right:0;top:0;bottom:0;width:46%;background:#fff;padding:16px 14px;transform:translateX(105%);box-shadow:-10px 0 24px #0003}
.tg{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.tg i{flex:1;height:5px;border-radius:3px;background:#3a3f6e}

const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const norm = s => s.normalize('NFC').toLowerCase().replace(/[^a-z0-9가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');
function jamo(s){
  let o = '';
  for (const ch of s){
    const c = ch.charCodeAt(0) - 0xAC00;
    o += (c >= 0 && c < 11172) ? CHO[Math.floor(c / 588)] + JUNG[Math.floor(c % 588 / 28)] + JONG[c % 28] : ch;
  }
  return o;
}
// 편집 거리 (인접한 두 글자 순서 바뀜도 1로 센다)
function lev(a, b){
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++){
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][n];
}
const ALL = [], BYID = {};
SHEETS.forEach(sh => sh.categories.forEach(cat => cat.terms.forEach(t => {
  t.sheet = sh; t.cat = cat;
  t.keys = [...new Set([...t.en, ...t.ko].map(norm))];
  t.jkeys = t.keys.map(jamo);
  t.nickKeys = t.nick.split(/[\/→]/).map(norm).filter(Boolean).concat(norm(t.nick));
  t.koDisplay = t.koDisplay || t.ko[0];
  ALL.push(t); BYID[t.id] = t;
})));

function grade(input, term){
  const n = norm(input);
  if (!n) return {ok: false, kind: 'empty'};
  if (term.keys.includes(n)) return {ok: true, kind: 'exact'};
  const others = ALL.filter(t => t !== term);
  const exactOther = others.find(t => t.keys.includes(n));
  if (exactOther) return {ok: false, kind: 'other', other: exactOther};
  if (ALL.some(t => t.nickKeys.includes(n))) return {ok: false, kind: 'nick'};
  const nj = jamo(n);
  let best = Infinity;
  term.jkeys.forEach(k => { const d = lev(nj, k); if (d <= (k.length <= 6 ? 1 : 2) && d < best) best = d; });
  if (best === Infinity) return {ok: false, kind: 'wrong'};
  const otherBest = Math.min(...others.flatMap(t => t.jkeys.map(k => lev(nj, k))));
  if (otherBest <= best) return {ok: false, kind: 'wrong'};
  return {ok: true, kind: 'typo'};
}

const $ = s => document.querySelector(s);
function h(tag, cls, parent, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function css(e, o){ Object.assign(e.style, o); return e; }
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// 데모가 축소(transform: scale)된 무대에 그려질 때 화면 좌표 → 무대 좌표 비율
const scaleOf = el => el.getBoundingClientRect().width / el.offsetWidth || 1;

function makeCtx(owner){
  const timers = [], anims = [];
  return {
    alive: true,
    timeout(fn, ms){ timers.push(setTimeout(() => { if (this.alive) fn(); }, ms)); },
    loop(fn){
      const self = this; let last = performance.now();
      (function f(now){ if (!self.alive) return; const dt = Math.min(50, now - last); last = now; fn(now, dt); requestAnimationFrame(f); })(last);
    },
    anim(node, kf, opt){ const a = node.animate(kf, opt); anims.push(a); return a; },
    manual: () => owner.manual,
    ptr: () => owner.ptr.inside ? [owner.ptr.x, owner.ptr.y] : null,
    dispose(){ this.alive = false; timers.forEach(clearTimeout); anims.forEach(a => a.cancel()); },
  };
}

// 데모 하나를 무대 하나에서 반복 재생한다. 전체 보기 화면은 용어마다 하나씩 만든다
const createPlayer = () => ({
  stage: null, root: null, ctx: null, id: null, manual: false, ptr: {x: 0, y: 0, inside: false},
  bind(stage){
    if (stage._bound) return; stage._bound = true;
    const set = e => { if (this.stage !== stage) return; const r = stage.getBoundingClientRect(), k = scaleOf(stage); this.ptr.x = (e.clientX - r.left) / k; this.ptr.y = (e.clientY - r.top) / k; this.ptr.inside = true; this.manual = true; };
    stage.addEventListener('pointerenter', set);
    stage.addEventListener('pointermove', set);
    stage.addEventListener('pointerleave', () => { if (this.stage === stage){ this.manual = false; this.ptr.inside = false; } });
  },
  start(stage, id){
    this.stop(); this.bind(stage); this.stage = stage; this.id = id;
    this.manual = stage.matches(':hover'); this.ptr.inside = this.manual;
    const tryBadge = stage.querySelector('.try');
    if (tryBadge) tryBadge.hidden = !DEMOS[id].interactive;
    this.run();
  },
  run(){
    if (this.ctx) this.ctx.dispose();
    if (this.root) this.root.remove();
    const root = this.root = h('div', 'd-root', this.stage);
    const c = this.ctx = makeCtx(this);
    const ms = DEMOS[this.id].fn(root, c, root.clientWidth, root.clientHeight);
    if (ms > 0) c.timeout(() => this.run(), ms + 800);
  },
  stop(){ if (this.ctx) this.ctx.dispose(); if (this.root) this.root.remove(); this.ctx = this.root = null; },
  replay(){ if (this.stage && this.id) this.run(); },
});
const Player = createPlayer();

const EASE = { lin: t => t, in: t => t * t * t, out: t => 1 - Math.pow(1 - t, 3), inout: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 };
const CURSOR = '<svg width="22" height="24" viewBox="0 0 22 24"><path d="M3 2l15 9-6.5 1.6L8.5 20z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const CART = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 7H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>';

function wayPos(pts, seg, t){
  const n = pts.length, tt = (t / seg) % n, i = Math.floor(tt), f = tt - i;
  const a = pts[i], b = pts[(i + 1) % n], e = EASE.inout(f);
  return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
}
const kf = (frames, easing) => frames.map(f => Object.assign({easing}, f));

// 속도 곡선 데모: 일정 시간마다 잔상을 찍어 간격으로 가속·감속을 보여준다
function ghostRun(r, c, W, H, rows){
  const pad = Math.max(30, W * .1), len = W - pad * 2, dur = 1700;
  const items = rows.map((row, i) => {
    const y = H / 2 + (i - (rows.length - 1) / 2) * 76;
    css(h('div', 'track', r), {left: pad + 'px', top: y + 'px', width: len + 'px'});
    const dot = css(h('div', 'gdot', r), {background: row.color, color: row.color, top: y + 'px'});
    return {row, y, dot};
  });
  let t0 = null, lastG = -1;
  c.loop(now => {
    if (t0 === null) t0 = now;
    const el = now - t0 - 300, p = Math.max(0, Math.min(1, el / dur));
    const gi = Math.floor(Math.max(0, el) / 110), spawn = el >= 0 && el <= dur + 60 && gi !== lastG;
    items.forEach(it => {
      const x = pad + it.row.fn(p) * len, tf = `translate(${x}px,0) translate(-50%,-50%)`;
      it.dot.style.transform = tf;
      if (spawn) css(h('div', 'gdot ghost', r), {background: it.row.color, top: it.y + 'px', transform: tf});
    });
    if (spawn) lastG = gi;
  });
  return dur + 300 + 900;
}

// 스크롤 데모 공용: 자동 모드면 스크롤을 직접 움직이고, 마우스를 올리면 사용자가 휠로 조작
function autoScroll(c, sc, onScroll){
  let t = 0;
  sc.addEventListener('scroll', () => onScroll(sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight)));
  c.loop((now, dt) => {
    if (c.manual()) return;
    t = (t + dt) % 4800;
    const max = sc.scrollHeight - sc.clientHeight;
    let p;
    if (t < 600) p = 0; else if (t < 3600) p = EASE.inout((t - 600) / 3000); else if (t < 4200) p = 1; else p = 1 - EASE.inout((t - 4200) / 600);
    sc.scrollTop = p * max;
  });
  onScroll(0);
}

function confettiBurst(r, c, x, y){
  const colors = ['#7c6cff', '#f6b93f', '#3ddc97', '#ff6b81', '#5fe3ff', '#ffffff'];
  for (let i = 0; i < 70; i++){
    const p = css(h('i', 'conf', r), {background: colors[i % colors.length], left: x + 'px', top: y + 'px'});
    const ang = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.2, v = 260 + Math.random() * 300, rot = (Math.random() - .5) * 1400;
    const frames = [];
    for (let k = 0; k <= 10; k++){
      const t = k / 10 * 1.5;
      frames.push({transform: `translate(${Math.cos(ang) * v * t * .8}px,${Math.sin(ang) * v * t + 420 * t * t}px) rotate(${rot * k / 10}deg)`, opacity: k > 7 ? 1 - (k - 7) / 3 : 1});
    }
    c.anim(p, frames, {duration: 1500, fill: 'both'});
  }
}

  const it = [['홈', 0], ['주문', 1], ['주문 내역', 2], ['환불 신청', 3], ['설정', 1]].map(([x, d]) => css(h('div', '', w, `${d ? '└ ' : ''}${x}`), {marginLeft: d * 14 + 'px', padding: '2px 6px', borderRadius: '6px', width: 'fit-content'}));
  [0, 1, 2, 3].forEach((k, n) => A(c, it[k], [{background: '#f6f7ff00', color: '#23264a'}, {background: '#5b4bf0', color: '#ffffff'}], 200, 500 + n * 500));

  return 3000;

  [[60, 30, 90], [150, 90, 110], [70, 170, 70], [240, 85, 60]].forEach(([x, y, sz], i) => A(c, css(h('i', '', s), {position: 'absolute', left: x - sz / 2 + 'px', top: y - sz / 2 + 'px', width: sz + 'px', height: sz + 'px', borderRadius: '50%', background: 'radial-gradient(circle,#ff2d2dcc 0,#ffb300aa 40%,#ffee0055 62%,#ffee0000 72%)'}), [{opacity: 0, transform: 'scale(.3)'}, {opacity: 1, transform: 'none'}], 600, 300 + i * 350));

    const b = css(h('div', '', w, `<b>${t}</b> ${v}%`), {width: Math.max(v, 44) + '%', padding: '10px 0', background: ['#7c6cff', '#6e5fe0', '#5f51c4', '#f6b93f'][i], color: i === 3 ? '#221a00' : '#fff', borderRadius: '8px', textAlign: 'center', fontSize: '13px', whiteSpace: 'nowrap'});

/* ================= 퀴즈 진행 ================= */
const BEST_KEY = (sheetId, m, all) => `${sheetId}Quiz.best.${m}${all ? '.all' : ''}`;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
};
const fmt = n => (Math.round(n * 10) / 10).toString();
const S = {mode: 'subjective', queue: [], idx: 0, score: 0, results: [], ranked: false, phase: 'idle', hint: false, total: 0};
const show = id => document.querySelectorAll('.screen').forEach(s => { s.hidden = s.id !== id; });
const mode = () => document.querySelector('input[name=mode]:checked').value;
const curSheet = () => SHEETS.find(s => s.id === document.querySelector('input[name=sheet]:checked').value);

function renderStart(){
  $('#sheets').innerHTML = SHEETS.map((sh, i) => `<label class="mode"><input type="radio" name="sheet" value="${sh.id}"${i ? '' : ' checked'}><span><b>${sh.short}</b><small>${sh.title} · ${sh.categories.reduce((n, c) => n + c.terms.length, 0)}개</small></span></label>`).join('');
  $('#sheets').addEventListener('change', renderSheet);
  $('#cats').addEventListener('change', updatePool);
  renderSheet();
}
function renderSheet(){
  const sh = curSheet();
  $('#cats').innerHTML = sh.categories.map(cat => `<label class="cat"><input type="checkbox" value="${cat.id}" checked><span>${cat.name} (${cat.terms.length})</span></label>`).join('');
  $('#btnSheet').textContent = `📋 전체 보기 (${sh.short} ${sheetSize(sh)}개 한눈에)`;
  const credits = [DERIVED, SHEETS[1].credit, SHEETS[0].credit];
  $('#credit').innerHTML = '문제 출처: 유튜브 코드깎는노인<br>' + credits.map(s => s === sh.credit ? `<b>${s}</b>` : s).join('<br>');
  updatePool(); renderBests();
}
function selectedPool(){
  const sh = curSheet(), ids = [...document.querySelectorAll('#cats input:checked')].map(i => i.value);
  return sh.categories.filter(c => ids.includes(c.id)).flatMap(c => c.terms);
}
function updatePool(){
  const n = selectedPool().length, q = Math.min(10, n);
  $('#poolCount').textContent = `${n}개 용어`;
  $('#btnStart').disabled = $('#btnAll').disabled = n === 0;
  $('#btnStart').textContent = n ? `${q}문제 시작` : '범위를 하나 이상 골라주세요';
  $('#btnAll').textContent = n ? `모든 문제 시작 (${n}문제)` : '모든 문제 시작';
  $('#btnAll').hidden = n === 0;
}
const sheetSize = sh => sh.categories.reduce((n, c) => n + c.terms.length, 0);
function renderBests(){
  const sh = curSheet(), b = (m, all) => { const v = store.get(BEST_KEY(sh.id, m, all)); return v == null ? '–' : `${fmt(+v)} / ${all ? sheetSize(sh) : 10}`; };
  $('#bests').innerHTML = `🏆 ${sh.short} 최고 점수<br>주관식 10문제 ${b('subjective')} · 전체 ${b('subjective', true)}<br>객관식 10문제 ${b('choice')} · 전체 ${b('choice', true)}`;
}

// all: 고른 범위의 문제를 전부 낸다. 최고 점수는 10문제 판과 시트 전체 판만 기록한다
function startRound(terms, ranked, all){
  S.mode = mode(); S.sheet = terms[0].sheet; S.queue = shuffle(terms).slice(0, all ? terms.length : 10); S.total = S.queue.length;
  S.idx = 0; S.score = 0; S.results = [];
  S.all = !!all && S.total === sheetSize(S.sheet);
  S.ranked = ranked && (S.all || (!all && S.total === 10));
  show('quiz'); ask();
}

function buildChoices(term){
  const same = term.cat.terms.filter(t => t !== term);
  const others = term.sheet.categories.flatMap(c => c.terms).filter(t => t.cat !== term.cat);
  const pick = (FORCED[term.id] || []).map(id => BYID[id]);
  shuffle(same.filter(t => !pick.includes(t))).forEach(t => { if (pick.length < 3) pick.push(t); });
  pick.push(...shuffle(others.filter(t => !pick.includes(t))).slice(0, 4 - pick.length));
  // 카테고리가 하나뿐인 시트는 같은 카테고리에서 마저 채운다
  pick.push(...shuffle(same.filter(t => !pick.includes(t))).slice(0, 4 - pick.length));
  return shuffle([term, ...pick]);
}

function ask(){
  const term = S.queue[S.idx];
  S.phase = 'asking'; S.hint = false;
  $('#qNum').textContent = `${S.idx + 1} / ${S.total}`;
  $('#qBar').style.width = S.idx / S.total * 100 + '%';
  $('#qScore').textContent = `${fmt(S.score)}점`;
  $('#hintText').textContent = '';
  $('#btnHint').disabled = false;
  $('#feedback').hidden = true;
  const area = $('#answerArea');
  if (S.mode === 'subjective'){
    area.innerHTML = '<form class="ansrow" id="ansForm"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="효과 이름을 영어 또는 한글로 입력"><button class="primary">제출</button></form><button class="link" id="btnSkip" type="button">모르겠어요</button>';
    $('#ansForm').addEventListener('submit', e => { e.preventDefault(); if ($('#ans').value.trim()) answer($('#ans').value); });
    $('#btnSkip').addEventListener('click', () => answer(''));
    $('#ans').focus();
  } else {
    S.choices = buildChoices(term);
    area.innerHTML = '<div class="choices">' + S.choices.map((t, i) => `<button class="choice" data-i="${i}"><kbd>${i + 1}</kbd>${t.display}</button>`).join('') + '</div>';
    area.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
  }
  Player.start($('#stage'), term.id);
}

function choose(i){
  if (S.phase !== 'asking') return;
  const term = S.queue[S.idx], picked = S.choices[i];
  document.querySelectorAll('.choice').forEach((b, j) => {
    b.disabled = true;
    if (S.choices[j] === term) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
  });
  finishAnswer(picked === term ? {ok: true, kind: 'exact'} : {ok: false, kind: 'pick'}, picked.display);
}
function answer(text){
  if (S.phase !== 'asking') return;
  const g = grade(text, S.queue[S.idx]);
  if (!text) g.kind = 'skip';
  $('#ans').disabled = true;
  document.querySelectorAll('#ansForm button, #btnSkip').forEach(b => b.disabled = true);
  finishAnswer(g, text.trim());
}

function finishAnswer(g, given){
  const term = S.queue[S.idx];
  S.phase = 'answered';
  const pts = g.ok ? (S.hint ? .5 : 1) : 0;
  S.score += pts;
  S.results.push({term, ok: g.ok, hint: S.hint, given});
  $('#qScore').textContent = `${fmt(S.score)}점`;
  $('#btnHint').disabled = true;
  const msg = {
    exact: S.hint ? '힌트를 써서 0.5점이에요.' : '',
    typo: `오타는 봐드렸어요${S.hint ? ' (힌트 사용 0.5점)' : ''}. 올바른 철자를 확인하세요.`,
    other: g.other ? `입력한 답은 다른 효과(${g.other.display})예요.` : '',
    nick: `${S.sheet.nickLabel}은(는) 정답으로 인정하지 않아요. 용어 이름으로 답해주세요.`,
    skip: '괜찮아요, 정답을 확인해보세요.',
    empty: '', wrong: given ? `내 답: ${esc(given)}` : '',
    pick: `고른 답: ${esc(given)}`,
  }[g.kind] || '';
  const last = S.idx === S.total - 1;
  const fb = $('#feedback');
  fb.innerHTML = `<div class="verdict ${g.ok ? 'ok' : 'bad'}">${g.ok ? (g.kind === 'typo' ? '✅ 정답! (오타 인정)' : '✅ 정답!') : '❌ 아쉬워요'}</div>
    ${msg ? `<div class="msg">${msg}</div>` : ''}
    <div class="name">${term.display}<small>(${term.koDisplay})</small>${term.extra ? '<span class="tag">시트 외 추가</span>' : ''}</div>
    <div class="nick">${S.sheet.nickLabel} “${term.nick}”</div>
    <div class="desc">${term.desc}</div>
    <button class="primary" id="btnNext">${last ? '결과 보기' : '다음 →'}</button>`;
  fb.hidden = false;
  $('#btnNext').addEventListener('click', next);
  $('#btnNext').focus({preventScroll: true});
  fb.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
const esc = s => s.replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));

function next(){
  if (S.phase !== 'answered') return;
  S.idx++;
  if (S.idx < S.total) ask(); else finish();
}

function finish(){
  S.phase = 'done';
  Player.stop();
  show('result');
  $('#rScore').innerHTML = `${fmt(S.score)}<small> / ${S.total}</small>`;
  const key = BEST_KEY(S.sheet.id, S.mode, S.all), prev = store.get(key);
  let bestTxt;
  if (S.ranked){
    if (prev == null || S.score > +prev){ store.set(key, S.score); bestTxt = '🎉 최고 점수 갱신!'; }
    else bestTxt = `🏆 최고 점수 ${fmt(+prev)} / ${S.total}`;
  } else bestTxt = '연습 라운드(범위를 좁혔거나 틀린 문제 다시 풀기)는 최고 점수에 반영되지 않아요.';
  $('#rTitle').textContent = `결과 · ${S.sheet.short} · ${S.mode === 'subjective' ? '주관식' : '객관식'}`;
  $('#rBest').textContent = bestTxt;
  const wrong = S.results.filter(x => !x.ok);
  $('#rWrongWrap').hidden = !wrong.length;
  $('#btnRetry').hidden = !wrong.length;
  if (!wrong.length){ $('#rBest').textContent += ' · 전부 맞혔어요!'; return; }
  const list = $('#rWrongs');
  list.innerHTML = wrong.map((x, i) => `<button data-i="${i}"><b>${x.term.display}</b> ${x.term.koDisplay} · ${S.sheet.nickLabel} “${x.term.nick}”${x.given ? `<br><small>내 답: ${esc(x.given)}</small>` : ''}</button>`).join('');
  const play = i => { list.querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', i === j)); Player.start($('#rStage'), wrong[i].term.id); };
  list.querySelectorAll('button').forEach(b => b.addEventListener('click', () => play(+b.dataset.i)));
  play(0);
}

document.addEventListener('keydown', e => {
  if (S.phase === 'answered' && e.key === 'Enter'){ e.preventDefault(); next(); return; }
  if (S.phase === 'asking' && S.mode === 'choice' && /^[1-5]$/.test(e.key)) choose(+e.key - 1);
});
$('#btnStart').addEventListener('click', () => startRound(selectedPool(), true));
$('#btnAll').addEventListener('click', () => startRound(selectedPool(), true, true));
$('#btnReplay').addEventListener('click', () => Player.replay());
$('#btnHint').addEventListener('click', () => {
  if (S.phase !== 'asking') return;
  S.hint = true; $('#btnHint').disabled = true;
  $('#hintText').textContent = `${S.sheet.nickLabel}: “${S.queue[S.idx].nick}”`;
  if ($('#ans')) $('#ans').focus();
});
$('#btnRetry').addEventListener('click', () => startRound(S.results.filter(x => !x.ok).map(x => x.term), false, true));
// 전체 보기: 시트의 용어를 카테고리별로 한 화면에 모두 띄우고, 카드마다 데모를 따로 재생한다
const SV = {players: [], ro: null};
const SV_CODE = {motion: 'MOTION CHEAT SHEET', ui: 'UI CHEAT SHEET', style: 'STYLE CHEAT SHEET', dark: 'DARK PATTERN CHEAT SHEET', psych: 'PSYCHOLOGY CHEAT SHEET', research: 'RESEARCH CHEAT SHEET'};
function stopSheet(){
  SV.players.forEach(p => p.stop()); SV.players = [];
  if (SV.ro) SV.ro.disconnect(); SV.ro = null;
  if (SV.io) SV.io.disconnect(); SV.io = null;
  $('#svBody').innerHTML = '';
  document.querySelector('.app').classList.remove('wide');
}
function showSheet(){
  const sh = curSheet();
  Player.stop(); stopSheet();
  document.querySelector('.app').classList.add('wide');
  $('#svEyebrow').textContent = SV_CODE[sh.id] || 'CHEAT SHEET';
  $('#svTitle').textContent = `${sh.title} ${sheetSize(sh)}`;
  let n = 0;
  $('#svBody').innerHTML = sh.categories.map(cat => {
    const from = n + 1; n += cat.terms.length;
    return `<div class="sv-cat"><h3><div>${cat.name}<span>${from}–${n}</span></div><small>${cat.id.toUpperCase()}</small></h3><div class="sv-grid">` +
      cat.terms.map((t, i) => `<div class="sv-card" data-id="${t.id}"><div class="mini"><div class="stage"></div></div><b>${t.display}</b><div class="meta"><span>${t.nick}</span><i>${String(from + i).padStart(2, '0')}</i></div></div>`).join('') +
      '</div></div>';
  }).join('');
  show('sheetView'); window.scrollTo(0, 0);
  // 데모는 480×300 무대에 그린 뒤 카드 폭에 맞게 줄인다
  const fit = mini => { mini.firstChild.style.transform = `scale(${mini.clientWidth / 480})`; };
  SV.ro = new ResizeObserver(es => es.forEach(e => fit(e.target)));
  // 카드가 많으므로 화면에 보이는 카드의 데모만 재생한다
  SV.io = new IntersectionObserver(es => es.forEach(e => {
    const p = e.target._player;
    if (e.isIntersecting){ if (!p.root) p.start(e.target.querySelector('.stage'), e.target.dataset.id); }
    else p.stop();
  }), {rootMargin: '120px'});
  document.querySelectorAll('#svBody .sv-card').forEach(card => {
    const mini = card.querySelector('.mini'); fit(mini); SV.ro.observe(mini);
    const p = createPlayer(); card._player = p; SV.players.push(p); SV.io.observe(card);
  });
}
const goHome = () => { Player.stop(); stopSheet(); S.phase = 'idle'; renderBests(); show('start'); };
$('#btnHome').addEventListener('click', goHome);
$('#btnQuit').addEventListener('click', goHome);
$('#btnSvHome').addEventListener('click', goHome);
$('#btnSheet').addEventListener('click', showSheet);
renderStart();
</script>
