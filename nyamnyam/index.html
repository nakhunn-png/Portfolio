<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfe3ff">
<title>냠냠 탈출 대작전</title>
<link rel="icon" href="img/yeongyang.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- 게임 HUD -->
  <div id="hud" hidden>
    <div class="hud-l">
      <div id="stageName">1층</div>
      <div id="roomName"></div>
      <div id="lives"></div>
    </div>
    <button id="detector" class="detector" aria-label="쪽지 감지기. 누르면 영양이가 방 이름을 알려 줘요">
      <span class="d-ico">📜</span><span class="bars"><i></i><i></i><i></i><i></i><i></i></span><b id="detText">조각과 멀어요</b><small>누르면 힌트</small>
    </button>
    <div class="hud-r">
      <button id="soundBtn" class="round" aria-label="소리">🔇</button>
      <button id="menuBtn" class="round" aria-label="메뉴">☰</button>
    </div>
    <div id="compass" hidden><span id="arrow">➜</span><b>탈출문</b></div>
    <div id="tutBox" hidden>
      <img src="img/yeongyang.png" alt="">
      <div><small id="tutStep">연습 1/9</small><p id="tutText"></p></div>
      <button id="tutSkip">튜토리얼 건너뛰기 ⏭</button>
    </div>
    <div class="pad">
      <button id="noteBtn" class="pbtn"><span class="e">📜</span><span>쪽지 <b id="noteN">0/4</b></span><kbd>Tab</kbd></button>
      <button id="itemBtn" class="pbtn"><span class="e" id="itemIco">✋</span><span id="itemName">빈손</span><kbd>Q</kbd></button>
      <button id="bubbleBtn" class="pbtn bubble"><span class="e">🫧</span><span>비눗방울 <b id="soapN">0</b></span><kbd>F</kbd></button>
      <button id="actBtn" class="pbtn act" hidden><span id="actLabel">살펴보기</span><kbd>E</kbd></button>
    </div>
    <div id="joy" hidden><div id="knob"></div></div>
  </div>

  <div id="say" hidden><img src="img/yeongyang.png" alt=""><div><b>영양이</b><p id="sayText"></p></div></div>
  <div id="bigMsg" hidden></div>
  <div id="toasts"></div>

  <!-- 화면들 -->
  <section class="screen title" id="sTitle">
    <img class="title-art" src="img/title.webp" alt="">
    <div class="title-panel">
      <h1 class="logo"><span>냠냠</span><span>탈출 대작전</span></h1>
      <p class="kicker">균을 피해 영양 쪽지를 모아 탈출하자!</p>
      <div class="diffs" id="diffs"></div>
      <button class="big start" id="startBtn">시작하기</button>
      <div class="row">
        <button class="tool" id="soundBtn2">🔇 소리 꺼짐</button>
        <button class="tool" id="fullBtn">⛶ 전체 화면</button>
      </div>
    </div>
    <button class="tool teacher" id="teacherBtn">👩‍🏫 선생님</button>
  </section>

  <section class="screen pick" id="sClass" hidden>
    <h2>몇 반인가요?</h2>
    <div class="grid g5" id="classGrid"></div>
    <button class="link" data-back="sTitle">← 처음 화면</button>
  </section>

  <section class="screen pick" id="sNum" hidden>
    <h2 id="numTitle">몇 번인가요?</h2>
    <div class="grid g6" id="numGrid"></div>
    <button class="link" data-back="sClass">← 반 다시 고르기</button>
  </section>

  <section class="screen pick" id="sResume" hidden>
    <h2 id="resumeTitle">이어 할까요?</h2>
    <div class="card" id="resumeInfo"></div>
    <div class="menu">
      <button class="big" id="contBtn">▶ 이어 하기</button>
      <button class="big alt" id="newBtn">처음부터 새로 하기</button>
    </div>
    <button class="link" data-back="sNum">← 번호 다시 고르기</button>
  </section>

  <section class="screen pick" id="sBand" hidden>
    <h2>몇 학년인가요?</h2>
    <div class="cards" id="bandCards"></div>
    <button class="link" data-back="sNum">← 번호 다시 고르기</button>
  </section>

  <section class="screen pick" id="sCourse" hidden>
    <h2>얼마나 놀까요?</h2>
    <div class="cards" id="courseCards"></div>
    <button class="link" data-back="sBand">← 학년 다시 고르기</button>
  </section>

  <section class="screen pick" id="sChar" hidden>
    <h2>함께 탈출할 친구를 골라요</h2>
    <div class="cards chars" id="charCards"></div>
    <button class="link" data-back="sCourse">← 다시 고르기</button>
  </section>

  <section class="screen pick" id="sTeacher" hidden>
    <h2>👩‍🏫 선생님 화면</h2>
    <div class="row">
      <label>반 <select id="tClass"></select></label>
      <button class="tool danger" id="tClear">이 반 기록 모두 지우기</button>
      <button class="tool" data-back="sTitle">← 처음 화면</button>
    </div>
    <div class="tablewrap"><table id="tTable"></table></div>
    <p class="note">기록은 이 태블릿 안에만 저장돼요. 태블릿마다 따로 확인해 주세요.</p>
  </section>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
</div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
