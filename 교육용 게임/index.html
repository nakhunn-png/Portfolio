<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff6df"><title>열매 마을 축제</title>
<style>
:root{--ink:#493d35;--cream:#fff8e9;--green:#85bd76;--deep:#438b68;--orange:#f4a65e;--pink:#f3a8a0;--blue:#9dcbe0;--shadow:0 8px 24px #745c3920}*{box-sizing:border-box}body{margin:0;background:#edf5dc;color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif;touch-action:manipulation}button{font:inherit;color:inherit;border:0;border-radius:18px;background:white;box-shadow:var(--shadow);padding:14px 20px;cursor:pointer;font-weight:750;min-height:58px}button:active{transform:translateY(2px)}button:focus-visible{outline:4px solid #569bce} .app{min-height:100dvh;display:grid;place-items:center;padding:20px}.frame{width:min(1280px,100%);min-height:min(800px,calc(100dvh - 40px));aspect-ratio:16/10;background:var(--cream);border:7px solid #fff;border-radius:32px;box-shadow:0 20px 60px #58674325;position:relative;overflow:hidden;padding:26px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:clamp(20px,3vw,32px);font-weight:900;color:#49815b}.stats{display:flex;gap:10px;align-items:center}.pill{padding:10px 15px;border-radius:99px;background:#fff;box-shadow:var(--shadow);font-weight:800}.content{flex:1;display:grid;place-items:center;text-align:center;padding:18px}.panel{width:min(760px,100%);background:#fff;border-radius:30px;padding:clamp(24px,4vw,48px);box-shadow:var(--shadow)}h1{font-size:clamp(36px,6vw,68px);margin:10px 0;color:#438b68}h2{font-size:clamp(26px,4vw,42px);margin:8px 0 18px}p{font-size:clamp(20px,2.5vw,28px);line-height:1.55}.hero{font-size:96px}.row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:22px}.row button{min-width:120px}.primary{background:#f4ad69;color:#fff}.soft{background:#e4f1dc}.danger{background:#f9e2da}.grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:14px;margin:20px auto;max-width:620px}.grid button{font-size:24px;min-height:85px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(850px,100%)}.place{min-height:175px;background:#e5f1d9;font-size:22px}.place .emoji{display:block;font-size:22px;font-weight:800;margin-bottom:10px;color:#438b68}.locked{opacity:.48}.progress{display:flex;gap:8px;justify-content:center}.dot{height:14px;width:14px;border-radius:50%;background:#ded8c7}.dot.on{background:#85bd76}.equation{font-size:clamp(38px,7vw,76px);font-weight:900;letter-spacing:3px;margin:16px}.visual{min-height:95px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.fruit{font-size:36px}.tenframe{display:grid;grid-template-columns:repeat(5,40px);gap:5px;padding:8px;background:#f9edce;border-radius:12px}.cell{width:40px;height:40px;border:2px solid #dbbd83;border-radius:10px;font-size:24px;display:grid;place-items:center}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:440px;margin:18px auto}.keypad button{min-height:55px;padding:8px}.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#493d35;color:#fff;padding:12px 22px;border-radius:99px;display:none}.hint{background:#f1f6e9;padding:12px;border-radius:18px;margin:10px auto;max-width:540px}.wide{width:100%}@media(max-width:700px){.frame{aspect-ratio:auto;min-height:calc(100dvh - 20px);padding:15px;border-width:4px}.app{padding:10px}.map{grid-template-columns:1fr}.place{min-height:100px}.hero{font-size:64px}.grid{gap:8px}.grid button{min-height:65px;font-size:19px}.stats .pill{padding:8px;font-size:14px}}
</style>
<style>.picker{display:grid;grid-template-columns:repeat(5,minmax(54px,1fr));gap:10px;max-width:560px;margin:18px auto}.picker button{min-height:66px;font-size:21px}.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.navrow button{min-width:120px}.scene{display:flex;justify-content:center;align-items:center;gap:18px;margin:18px auto;min-height:110px}.fruit-svg{width:38px;height:44px;vertical-align:middle}@media(max-width:700px){.picker{grid-template-columns:repeat(4,1fr)}}</style>
</head>
<body><div class="app"><main class="frame" id="app"></main></div><div class="toast" id="toast"></div>
<script>
'use strict';
const state={screen:'login',room:0,student:0,saveKey:'',data:null,level:2,station:0,q:0,questions:[],attempt:0,answer:'',firstCorrect:true,feedback:false,voice:false,dragPick:null,choose:'room'};
const stations=[{name:'열매 기차',emoji:'',desc:'열매를 싣고 내려요'},{name:'바구니 채우기',emoji:'',desc:'10을 만들어요'},{name:'10 올가미',emoji:'',desc:'10을 만들어 더해요'}];
const defaults=()=>({unlocked:0,completed:[],bestLevel:{},fruit:0,golden:0,tool:false,seenIntro:false,current:null});
const app=document.getElementById('app');
function load(){try{const raw=localStorage.getItem(state.saveKey);state.data=raw?{...defaults(),...JSON.parse(raw)}:defaults()}catch(e){state.data=defaults();state.memory=true}save()}
function save(){try{localStorage.setItem(state.saveKey,JSON.stringify(state.data));state.memory=false}catch(e){state.memory=true}}
function h(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fruitIcon(color='#ec745a'){return `<svg class="fruit-svg" viewBox="0 0 48 52" role="img" aria-label="열매"><path d="M24 14c-12-8-21 1-18 17 2 12 9 18 18 13 9 5 16-1 18-13 3-16-6-25-18-17Z" fill="${color}" stroke="#b65d4d" stroke-width="2"/><path d="M24 14c0-6 2-9 5-11" fill="none" stroke="#76513d" stroke-width="3" stroke-linecap="round"/><path d="M27 8c6-6 13-3 13 1-4 5-9 5-13-1Z" fill="#85bd76" stroke="#5c9563" stroke-width="1.5"/><circle cx="15" cy="25" r="3" fill="#fff" opacity=".6"/></svg>`}
function trainArt(){return `<div class="scene" aria-label="열매 기차 그림"><svg viewBox="0 0 270 115" width="270" height="115" role="img" aria-label="초록색 기차와 열매"><path d="M12 94h248" stroke="#9b805e" stroke-width="5" stroke-linecap="round"/><path d="M25 101h30m20 0h30m20 0h30m20 0h30m20 0h30" stroke="#c4a67b" stroke-width="4" stroke-linecap="round"/><rect x="35" y="43" width="138" height="44" rx="12" fill="#83bd78" stroke="#528b60" stroke-width="4"/><path d="M173 58h35l20 22v7h-55Z" fill="#f2b665" stroke="#bd8750" stroke-width="4"/><rect x="184" y="45" width="24" height="20" rx="5" fill="#bfe5ed" stroke="#528b60" stroke-width="3"/><circle cx="70" cy="91" r="12" fill="#5d554c"/><circle cx="70" cy="91" r="5" fill="#fff"/><circle cx="194" cy="91" r="12" fill="#5d554c"/><circle cx="194" cy="91" r="5" fill="#fff"/><path d="M56 43V31h25v12m9 0V25h25v18" fill="#eeb36a" stroke="#528b60" stroke-width="3"/>${fruitIcon('#e96d57')}</svg></div>`}
function sound(kind){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=kind==='ok'?660:kind==='bad'?240:kind==='win'?880:440;g.gain.value=.08;o.start();o.stop(c.currentTime+.12)}catch(e){}}
function say(text){if(!state.voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function speakControl(){return `<button class="pill" onclick="toggleVoice()" aria-label="음성 읽기">소리 ${state.voice?'켜짐':'읽기'}</button>`}
function toggleVoice(){state.voice=!state.voice;if(state.voice)say('안녕하세요. 열매 마을 축제에 오신 걸 환영해요.');render()}
function header(){return `<header class="top"><div class="brand">열매 마을 축제</div><div class="stats"><span class="pill">열매 ${state.data?.fruit||0}</span>${speakControl()}</div></header>`}
function shell(content){app.innerHTML=header()+`<section class="content">${content}</section>`}
function render(){switch(state.screen){case'login':return login();case'intro':return intro();case'map':return map();case'levels':return levels();case'question':return question();case'result':return result();default:return login()}}
function login(){state.data=state.data||defaults();if(state.choose==='room'){shell(`<div class="panel"><div class="hero" aria-hidden="true">●</div><h1>열매 마을 축제</h1><p>먼저 반을 골라요.</p><div class="picker">${Array.from({length:12},(_,i)=>`<button onclick="pickRoom(${i+1})">${i+1}반</button>`).join('')}</div><div class="row"><button onclick="renderResumeRooms()">이어하기</button></div></div>`);return}shell(`<div class="panel"><h2>${state.room}반을 골랐어요</h2><p>이제 번호를 골라요.</p><div class="picker">${Array.from({length:30},(_,i)=>`<button onclick="pickStudent(${i+1})">${i+1}번</button>`).join('')}</div><div class="navrow"><button onclick="state.choose='room';render()">뒤로</button><button onclick="renderResumeNumbers()">이어하기</button></div></div>`)}
function pickRoom(n){state.room=n;state.choose='student';render()}
function pickStudent(n){state.student=n;state.saveKey=`yeolmae_v1:${state.room}-${n}`;load();try{document.documentElement.requestFullscreen?.()}catch(e){}if(state.data.current){continueSavedGame();return}state.screen=state.data.seenIntro?'map':'intro';state.choose='room';render()}
function renderResumeRooms(){shell(`<div class="panel"><h2>이어할 기록 찾기</h2><p>반을 골라요.</p><div class="picker">${Array.from({length:12},(_,i)=>`<button onclick="state.room=${i+1};renderResumeNumbers()">${i+1}반</button>`).join('')}</div><div class="navrow"><button onclick="state.choose='room';render()">뒤로</button></div></div>`)}
function renderResumeNumbers(){shell(`<div class="panel"><h2>${state.room}반 기록 찾기</h2><p>번호를 골라요.</p><div class="picker">${Array.from({length:30},(_,i)=>`<button onclick="loadResume(${i+1})">${i+1}번</button>`).join('')}</div><div class="navrow"><button onclick="renderResumeRooms()">뒤로</button></div></div>`)}
function loadResume(n){state.student=n;state.saveKey=`yeolmae_v1:${state.room}-${n}`;load();state.choose='room';if(state.data.current){continueSavedGame();return}state.screen=state.data.seenIntro?'map':'intro';render()}
function continueSavedGame(){const c=state.data.current;state.station=c.station;state.level=c.level;state.q=c.q;state.questions=c.questions;state.attempt=0;state.answer='';state.feedback=false;state.firstCorrect=true;state.screen='question';render()}
function intro(){shell(`<div class="panel"><div class="hero" style="font-size:24px" aria-hidden="true">마을 소식</div><h2>축제가 사흘 남았어요!</h2><p>열매를 따고, 물건을 나르고,<br>달걀빵을 구워야 해요.</p><div class="navrow"><button onclick="state.screen='login';state.choose='room';render()">뒤로</button><button class="primary" onclick="state.data.seenIntro=true;save();state.screen='map';render()">톡이와 출발해요</button></div></div>`);say('축제가 사흘 남았어요. 열매를 따고, 물건을 나르고, 달걀빵을 구워야 해요.')}
function map(){shell(`<div class="panel wide"><h2>마을 지도</h2><p>갈 곳을 골라요. 하나씩 열려요.</p><div class="map"><button class="place" onclick="openStation(0)"><span class="emoji">나무와 열매</span>열매 과수원<br><small>${state.data.completed.length?1:0}/4</small></button><button class="place locked" disabled><span class="emoji">상자</span>택배 마을<br><small>준비 중</small></button><button class="place locked" disabled><span class="emoji">달걀 바구니</span>달걀 가게<br><small>준비 중</small></button></div><div class="navrow"><button onclick="state.screen='login';state.choose='room';render()">뒤로</button><button onclick="state.choose='room';state.screen='login';render()">학생 바꾸기</button></div></div>`)}
function openStation(stage){state.station=stage;state.screen='levels';render()}
function levels(){const prev=state.data.bestLevel[`${state.station}-${state.data.completed.length}`]||2;const labels=['쉬움','보통','어려움','아주 어려움'];shell(`<div class="panel">${trainArt()}<h2>${stations[state.station].name}</h2><p>${stations[state.station].desc}. 난이도를 골라요.</p><div class="row">${labels.map((x,i)=>`<button class="${i===prev-1?'primary':''}" onclick="startStation(${i+1})">${x}${i===prev-1?' · 추천':''}</button>`).join('')}</div><div class="navrow"><button onclick="state.screen='map';render()">뒤로</button></div><p style="font-size:15px">열매 기차부터 차례로 열려요.</p></div>`)}
function startStation(level){state.level=level;state.q=0;state.attempt=0;state.firstCorrect=true;state.questions=Array.from({length:level===1?3:4},()=>makeTrain(level));state.data.current={station:state.station,level:level,q:0,questions:state.questions};save();state.screen='question';render()}
function makeTrain(level){let a,b,c,op,ans,story='';if(level===1){if(Math.random()<.5){a=rand(1,3);b=rand(1,3);c=rand(0,Math.min(3,6-a-b));op='+';ans=a+b+c}else{a=rand(3,6);b=rand(1,Math.min(3,a-1));c=rand(0,a-b);op='−';ans=a-b-c}}else{if(Math.random()<.5){const triples=[];for(let x=1;x<=5;x++)for(let y=1;y<=5;y++)for(let z=1;z<=5;z++)if(x+y+z<=9)triples.push([x,y,z]);[a,b,c]=triples[rand(0,triples.length-1)];op='+';ans=a+b+c}else{a=rand(5,9);b=rand(1,a-1);c=rand(0,a-b);op='−';ans=a-b-c}}if(level===4&&Math.random()<.55){story=op==='+'?`토리가 열매를 ${a}개, ${b}개, ${c}개 땄어요. 모두 몇 개일까요?`:`토리가 열매 ${a}개를 갖고 있었어요. ${b}개를 싣고 ${c}개를 더 내렸어요. 몇 개 남았을까요?`}return{a,b,c,op,ans,story}}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function expression(x){return `${x.a} ${x.op} ${x.b} ${x.op} ${x.c}`}
function choices(ans){const arr=new Set([ans]);while(arr.size<3)arr.add(Math.max(0,ans+rand(-3,3)||ans+1));return [...arr].sort(()=>Math.random()-.5)}
function question(){const x=state.questions[state.q], total=state.questions.length;let statement=x.story||`열매 ${x.op==='+'?'기차에':'기차에서'} 계산해요.`;let visual='';if(state.level<=2){const colors=['#e96d57','#eab14e','#8bc47b'];visual=`<div class="visual"><span>${fruitIcon(colors[0]).repeat(x.a)}</span><span class="fruit">${x.op}</span><span>${fruitIcon(colors[1]).repeat(x.b)}</span><span class="fruit">${x.op}</span><span>${fruitIcon(colors[2]).repeat(x.c)}</span></div>`}let content=`<div class="panel"><div class="progress">${Array.from({length:total},(_,i)=>`<i class="dot ${i<=state.q?'on':''}"></i>`).join('')}</div><p>${h(statement)}</p>${trainArt()}${visual}<div class="equation">${state.level>=3?expression(x):'몇 개일까요?'}</div>${state.feedback?`<div class="hint">${state.attempt>=2?`같이 세어 봐요: ${expression(x)} = ${x.ans}`:'한 번 더 생각해 봐요. 열매를 차례로 세어요.'}</div>`:''}`;
if(state.level<=2)content+=`<div class="grid">${choices(x.ans).map(n=>`<button onclick="submitAnswer(${n})">${n}개</button>`).join('')}</div>`;else content+=`<div class="row"><div class="pill" style="font-size:34px;min-width:160px">${h(state.answer||'□')}</div></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'지우기',0,'확인'].map(n=>`<button onclick="${n==='확인'?'submitAnswer(+state.answer)':n==='지우기'?'clearAnswer()':`typeAnswer(${n})`}">${n}</button>`).join('')}</div>`;
content+=`<div class="navrow"><button onclick="state.screen='levels';render()">뒤로</button><button onclick="say(${JSON.stringify(statement+' '+expression(x))})">다시 듣기</button></div></div>`;shell(content);say(statement+' '+expression(x))}
function typeAnswer(n){state.answer=(state.answer+String(n)).slice(0,2);render()}function clearAnswer(){state.answer='';render()}
function submitAnswer(n){if(!Number.isFinite(n))return;const x=state.questions[state.q];if(n===x.ans){sound('ok');if(state.attempt===0)state.data.fruit+=2;else if(state.attempt===1)state.data.fruit++;state.answer='';state.feedback=false;if(++state.q>=state.questions.length){finishStation();return}state.data.current.q=state.q;save();state.attempt=0;render()}else{sound('bad');state.attempt++;state.firstCorrect=false;state.feedback=true;if(state.attempt>=2){setTimeout(()=>{state.q++;state.attempt=0;state.feedback=false;state.answer='';if(state.q>=state.questions.length)finishStation();else{state.data.current.q=state.q;save();render()}},1900)}render()}}
function finishStation(){state.data.completed.push(state.station);state.data.bestLevel[`${state.station}-${state.data.completed.length}`]=state.level;if(state.level===4)state.data.golden++;if(state.station===0&&state.data.completed.filter(x=>x===0).length>=1)state.data.tool=true;state.data.current=null;save();state.screen='result';render()}
function result(){const done=state.data.completed.length>=3;let content=`<div class="panel"><div class="hero" aria-hidden="true">${done?'축제':'참 잘했어요'}</div><h2>${done?'정거장을 모두 마쳤어요!':'잘했어요!'}</h2><p>${state.level===4?'황금 열매를 얻었어요.':`열매 ${state.firstCorrect?'도전했어요!':'를 모았어요!'}`}</p><div class="navrow"><button onclick="state.screen='map';render()">뒤로</button><button class="primary" onclick="nextStation()">${done?'축제 지도':'다음 정거장'}</button></div></div>`;shell(content)}
function nextStation(){state.screen='map';save();render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.()});
// 길게 누르기 확대 메뉴를 줄이고 당겨서 새로고침을 방지합니다.
document.addEventListener('contextmenu',e=>e.preventDefault());let touchY=0;document.addEventListener('touchstart',e=>{touchY=e.touches[0]?.clientY||0},{passive:true});document.addEventListener('touchmove',e=>{if(window.scrollY===0&&e.touches[0]?.clientY>touchY+10)e.preventDefault()},{passive:false});
render();
</script></body></html>
