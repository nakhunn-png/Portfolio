<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>냠냠 랜덤 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2026112011">
</head>
<body>
<div id="stage-wrap">
  <div id="game">
    <canvas id="bg" width="960" height="540"></canvas>
    <canvas id="field" width="960" height="540"></canvas>

    <!-- 시작 화면 -->
    <section id="scr-title" class="screen">
      <div class="title-box">
        <h1 class="logo"><span class="logo-a">냠냠</span> 랜덤 디펜스</h1>
        <p class="ribbon">수학을 풀고, 귀여운 영웅들과 함께하는 신나는 모험!</p>
      </div>
      <div id="title-heroes" class="title-heroes"></div>
      <div class="title-menu">
        <button id="btn-continue" class="btn big green continue-btn">이어하기</button>
        <button id="btn-start" class="btn big green">시작하기</button>
        <button id="btn-book" class="btn big purple">캐릭터 모아보기</button>
        <button id="btn-settings" class="btn big sky">설정</button>
      </div>
      <div id="save-note" class="save-note hidden">이 브라우저에서는 저장이 되지 않아 이어하기를 쓸 수 없어요. 크롬이나 엣지로 열어 주세요.</div>
    </section>

    <!-- 준비 단계 -->
    <section id="scr-prep" class="screen">
      <div class="hud">
        <div class="hud-chip stage-chip"><span class="star-badge" id="prep-stage-no">1</span><span id="prep-stage-name">초록 들판</span></div>
        <div class="hud-chip" id="prep-wave">무리 1 / 3</div>
        <div class="hud-chip level-chip" id="prep-level"></div>
        <div class="hud-chip hearts" id="prep-hearts"></div>
      </div>
      <button class="pause-btn" data-act="pause" title="멈춤"><span class="pause-icon"></span><span class="pause-label">멈춤</span></button>

      <div class="prep-body">
        <div class="panel math-panel" id="prep-math"></div>
        <div class="panel draw-panel">
          <div class="panel-title">캐릭터 뽑기</div>
          <div class="chest-wrap"><img id="chest-img" class="pix chest" alt=""></div>
          <div class="ticket-line"><img class="pix ticket-ico" alt=""> 뽑기권 <b id="prep-tickets">0</b>개</div>
          <div class="draw-btns">
            <button id="btn-draw" class="btn big orange">뽑기</button>
            <button id="btn-draw-all" class="btn orange-soft">모두 뽑기</button>
          </div>
        </div>
      </div>

      <div class="prep-bottom">
        <div class="panel roster-panel">
          <div class="roster-head">
            <span class="panel-title">출전할 친구들 <small id="lineup-count">0 / 8</small></span>
            <span class="grade-counts" id="grade-counts"></span>
          </div>
          <div class="lineup" id="lineup"></div>
          <div class="merge-box hidden" id="merge-box"></div>
        </div>
        <div class="go-box">
          <div class="next-info" id="next-info"></div>
          <button id="btn-fight" class="btn huge red">전투 시작!</button>
        </div>
      </div>
    </section>

    <!-- 전투 단계 -->
    <section id="scr-battle" class="screen passthru">
      <div class="hud">
        <div class="hud-chip stage-chip"><span class="star-badge" id="bt-stage-no">1</span><span id="bt-stage-name">초록 들판</span></div>
        <div class="hud-chip" id="bt-wave">무리 1 / 3</div>
        <div class="hud-chip level-chip" id="bt-level"></div>
        <div class="hud-chip hearts" id="bt-hearts"></div>
      </div>
      <button class="pause-btn" data-act="pause" title="멈춤"><span class="pause-icon"></span><span class="pause-label">멈춤</span></button>
      <div class="boss-bar hidden" id="boss-bar"><div class="boss-name" id="boss-name"></div><div class="bar"><i id="boss-fill"></i></div></div>
      <div class="banner hidden" id="wave-banner"></div>
      <div class="battle-bottom">
        <div class="bb-chip">보유 캐릭터 <span class="grade-counts" id="bt-grade-counts"></span></div>
        <div class="bb-chip"><img class="pix ticket-ico" alt=""> 뽑기권 <b id="bt-tickets">0</b>개</div>
        <div class="bb-chip auto-tag">자동 전투 중</div>
      </div>
    </section>

    <!-- 캐릭터 모아보기 -->
    <section id="scr-book" class="screen">
      <div class="book-head">
        <h2>캐릭터 모아보기</h2>
        <div class="book-sum" id="book-sum"></div>
        <button class="btn small sky" data-act="book-close">돌아가기</button>
      </div>
      <div class="book-tabs" id="book-tabs"></div>
      <div class="book-grid" id="book-grid"></div>
    </section>

    <!-- 설정 -->
    <section id="scr-settings" class="screen">
      <div class="panel settings-panel">
        <h2>설정</h2>
        <div class="set-row"><span>자동 합성</span><button class="toggle" id="set-merge"></button></div>
        <div class="set-row"><span>소리</span><button class="toggle" id="set-sound"></button></div>
        <div class="set-row"><span>문제 그림 도움 항상 보기</span><button class="toggle" id="set-hint"></button></div>
        <div class="set-row"><span>전투 빠르기</span><button class="toggle wide" id="set-speed"></button></div>
        <div class="set-row"><span>모아보기 기록 지우기</span><button class="btn small red" id="set-reset">지우기</button></div>
        <button class="btn big sky" data-act="settings-close">돌아가기</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="scr-result" class="screen">
      <div class="panel result-panel" id="result-panel"></div>
    </section>

    <!-- 겹쳐 뜨는 창 -->
    <div id="overlay" class="overlay hidden"></div>
    <div id="fx" class="fx-layer"></div>
    <div id="toast" class="toast hidden"></div>
  </div>
</div>

<!-- 휴대폰을 세로로 들었을 때 안내 -->
<div id="rotate-note" class="rotate-note hidden">
  <div class="rotate-box">
    <div class="rotate-phone"><i></i></div>
    <h2>휴대폰을 가로로 돌려 주세요!</h2>
    <p>가로로 돌리면 게임이 크게 보여요.</p>
    <button id="rotate-ok" class="btn small sky">이대로 할래요</button>
  </div>
</div>

<script src="js/config.js?v=2026112011"></script>
<script src="js/mathgen.js?v=2026112011"></script>
<script src="js/picture.js?v=2026112011"></script>
<script src="js/collection.js?v=2026112011"></script>
<script src="js/battle.js?v=2026112011"></script>
<script src="js/audio.js?v=2026112011"></script>
<script src="js/art/pixel.js?v=2026112011"></script>
<script src="js/art/characters.js?v=2026112011"></script>
<script src="js/art/monsters.js?v=2026112011"></script>
<script src="js/art/backgrounds.js?v=2026112011"></script>
<script src="js/render.js?v=2026112011"></script>
<script src="js/ui.js?v=2026112011"></script>
<script src="js/main.js?v=2026112011"></script>
</body>
</html>
